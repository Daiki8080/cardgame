<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>イラストカードバトル</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>

<!-- ===== タイトル画面 ===== -->
<section id="screen-title" class="screen active">
  <div class="center-box">
    <h1>🃏 イラストカードバトル</h1>
    <p id="title-info" class="note"></p>
    <button id="btn-start" class="btn">ゲーム開始</button>
    <button id="btn-create" class="btn">カード作成</button>
    <button id="btn-deck" class="btn">デッキ編成</button>
  </div>
</section>

<!-- ===== 対戦準備画面(デッキをえらぶ) ===== -->
<section id="screen-ready" class="screen">
  <h2>対戦準備</h2>
  <label>あなたのデッキ</label>
  <select id="sel-player"></select>
  <label>CPUのデッキ</label>
  <select id="sel-cpu"></select>
  <p id="ready-msg" class="note"></p>
  <button id="btn-battle" class="btn">バトル開始</button>
  <button class="btn ghost" data-go="title">タイトルへ戻る</button>
</section>

<!-- ===== カード作成画面 ===== -->
<section id="screen-create" class="screen">
  <h2>カード作成</h2>

  <label>カードの種類</label>
  <select id="f-kind">
    <option value="normal">通常カード</option>
    <option value="power">パワーアップカード</option>
  </select>

  <!-- パワーアップカードのときだけ出る -->
  <div id="power-fields" class="hidden power-box">
    <label>どの通常カードから置き換える?</label>
    <select id="f-base"></select>
    <label>置き換えのコスト(💎)</label>
    <input type="number" id="f-upcost" inputmode="numeric" min="0" placeholder="例:3">
    <p id="power-msg" class="note"></p>
  </div>

  <label>イラスト画像</label>
  <input type="file" id="f-img" accept="image/*">
  <div id="f-preview" class="preview">画像未選択</div>

  <label>カード名</label>
  <input type="text" id="f-name" maxlength="12" placeholder="例:ねこ戦士">

  <label>HP</label>
  <input type="number" id="f-hp" inputmode="numeric" min="1" placeholder="例:80">

  <!-- 技① -->
  <h3>技①</h3>
  <label>技の種類</label>
  <select id="f-a1type">
    <option value="attack">攻撃(相手1体にダメージ)</option>
    <option value="heal">回復(味方1体のHP回復)</option>
    <option value="all">全体攻撃(相手全員にダメージ)</option>
    <option value="sacrifice">捨て身(相手1体に大ダメージ、自分も受ける)</option>
    <option value="chance">確率攻撃(相手1体に、一定の確率でダメージ)</option>
  </select>
  <label>技の名前</label>
  <input type="text" id="f-a1name" maxlength="12" placeholder="例:パンチ">
  <div class="two">
    <div><label>コスト</label><input type="number" id="f-a1cost" inputmode="numeric" min="0" placeholder="例:2"></div>
    <div><label id="l-a1v1">ダメージ</label><input type="number" id="f-a1v1" inputmode="numeric" min="0" placeholder="例:30"></div>
  </div>
  <div id="w-a1v2" class="hidden"><label id="l-a1v2"></label><input type="number" id="f-a1v2" inputmode="numeric" min="0" placeholder="数字"></div>

  <!-- 技② -->
  <h3>技②</h3>
  <label>技の種類</label>
  <select id="f-a2type">
    <option value="attack">攻撃(相手1体にダメージ)</option>
    <option value="heal">回復(味方1体のHP回復)</option>
    <option value="all">全体攻撃(相手全員にダメージ)</option>
    <option value="sacrifice">捨て身(相手1体に大ダメージ、自分も受ける)</option>
    <option value="chance">確率攻撃(相手1体に、一定の確率でダメージ)</option>
  </select>
  <label>技の名前</label>
  <input type="text" id="f-a2name" maxlength="12" placeholder="例:必殺パンチ">
  <div class="two">
    <div><label>コスト</label><input type="number" id="f-a2cost" inputmode="numeric" min="0" placeholder="例:4"></div>
    <div><label id="l-a2v1">ダメージ</label><input type="number" id="f-a2v1" inputmode="numeric" min="0" placeholder="例:60"></div>
  </div>
  <div id="w-a2v2" class="hidden"><label id="l-a2v2"></label><input type="number" id="f-a2v2" inputmode="numeric" min="0" placeholder="数字"></div>

  <button id="btn-save-card" class="btn">保存</button>
  <button class="btn ghost" data-go="title">タイトルへ戻る</button>
</section>

<!-- ===== デッキ編成画面 ===== -->
<section id="screen-deck" class="screen">

  <!-- デッキの一覧 -->
  <div id="deck-manage">
    <h2>デッキ編成</h2>
    <p class="note">デッキはいくつでも作れます。1つのデッキは、通常カード10枚です(パワーアップカードは、通常カードと合わせて1枚の扱い)。</p>
    <div id="deck-rows"></div>
    <button id="btn-new-deck" class="btn">＋ 新しいデッキを作る</button>
    <button class="btn ghost" data-go="title">タイトルへ戻る</button>
  </div>

  <!-- デッキをつくる・直す -->
  <div id="deck-edit" class="hidden">
    <h2>デッキをつくる</h2>
    <label>デッキの名前</label>
    <input type="text" id="f-deckname" maxlength="12" placeholder="例:ねこデッキ">
    <p class="note">通常カードを10枚えらんでください(タップで選択)。</p>
    <p id="deck-count" class="count"></p>
    <div id="deck-list"></div>
    <button id="btn-sample" class="btn ghost">お試し用サンプルカードを追加</button>
    <button id="btn-save-deck" class="btn">このデッキを保存</button>
    <button id="btn-back-deck" class="btn ghost">一覧にもどる</button>
  </div>
</section>

<!-- ===== バトル画面 ===== -->
<section id="screen-battle" class="screen">
  <div id="c-info" class="info"></div>
  <div id="c-field" class="field"></div>
  <div id="center">
    <div id="turn-label"></div>
    <div id="log"></div>
  </div>
  <div id="p-field" class="field"></div>
  <div id="p-info" class="info"></div>
  <div class="row">
    <button id="btn-end" class="btn small">ターン終了</button>
    <button id="btn-cancel" class="btn small ghost" style="display:none">キャンセル</button>
    <button id="btn-quit" class="btn small ghost">やめる</button>
  </div>
  <div id="p-hand"></div>
</section>

<!-- ===== 勝敗画面 ===== -->
<section id="screen-result" class="screen">
  <div class="center-box">
    <h1 id="result-title"></h1>
    <button id="btn-again" class="btn">もう一度遊ぶ</button>
    <button class="btn ghost" data-go="ready">デッキをえらび直す</button>
    <button class="btn ghost" data-go="title">タイトルへ戻る</button>
  </div>
</section>

<!-- ===== メニュー(カードをタップしたとき) ===== -->
<div id="menu"><div id="menu-panel"></div></div>

<!-- ===== コイントス(バトル開始のとき) ===== -->
<div id="coin-overlay" class="hidden">
  <div class="coin-box">
    <div id="coin" class="coin">
      <div class="face f">表</div>
      <div class="face b">裏</div>
    </div>
    <div id="coin-text">コイントス!</div>
  </div>
</div>

<script src="game.js?v=3"></script>
</body>
</html>
